name: 🏗️ Сборка APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Скачать код
      uses: actions/checkout@v3
      
    - name: 🐍 Установить Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: ⚙️ Установить инструменты
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip python3-pip \
          openjdk-11-jdk
        
    - name: 📦 Установить Buildozer
      run: pip install buildozer cython==0.29.19
        
    - name: ⚙️ Создать конфиг
      run: |
        echo "[app]
title = Pill Tracker
package.name = pilltracker
package.domain = com.example
source.dir = .
source.main = main.py
version = 1.0.0
requirements = python3,kivy==2.1.0
orientation = portrait
android.permissions = INTERNET
android.arch = arm64-v8a
android.minapi = 21
android.api = 30
fullscreen = 0
android.accept_sdk_license = true

[buildozer]
log_level = 2" > buildozer.spec
        
    - name: 🏗️ Собрать APK
      run: |
        echo "🚀 НАЧИНАЮ СБОРКУ APK..."
        echo "⏳ ЭТО ЗАЙМЕТ 30-40 МИНУТ"
        buildozer android debug 2>&1 | tail -100
        echo "✅ СБОРКА ЗАВЕРШЕНА!"
        ls -la bin/ || echo "Папка bin не создана"
        
    - name: 📤 Загрузить APK
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: pilltracker-apk
        path: bin/*.apk
        retention-days: 7
